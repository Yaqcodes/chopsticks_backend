{% extends "emails/base.html" %}
{% block title %}Reward redeemed{% endblock %}
{% block content %}
<p>Hi {{ greeting_name }},</p>
<p>You successfully redeemed <strong>{{ reward.name }}</strong>.</p>
<p>Points spent: <strong>{{ points_spent }}</strong></p>
{% if frontend_url %}
<p><a href="{{ frontend_url }}" style="display:inline-block;margin-top:16px;padding:12px 24px;background-color:#111111;color:#ffffff;text-decoration:none;border-radius:4px;">View your rewards</a></p>
{% endif %}
{% endblock %}
